inherit_from: .rubocop_todo.yml
AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
    - 'lib/fhir_stu3_models/fhir/**/*'
    - 'lib/fhir_stu3_models/fluentpath/evaluate.rb'
    - 'lib/**/*.rake'
    - 'tmp/**/*'
    - '*.gemspec'
    - 'bin/*'
Layout/LineLength:
  Enabled: false
inherit_mode:
  merge:
    - Exclude
